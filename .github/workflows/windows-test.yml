# Windows test + build for Personal Photo Companion.
#
# Why this exists: the app is developed on Linux, where a Windows .exe
# cannot run natively and Wine does not reliably build/run the NSIS
# installer (32-bit stub stall). A GitHub-hosted windows-latest runner
# is a real Windows machine, so this workflow is the self-serve way to
# test Windows without a round-trip to a human's Windows PC.
#
# What it does, in order:
#   1. Unit tests (no display needed).
#   2. Builds the Windows NSIS installer with electron-builder.
#   3. Runs the Python artifact checks against dist/ (installer is a PE
#      executable, win-unpacked holds the current app files, no network
#      APIs in app sources).
#   4. Attempts a bounded launch of the unpacked Windows exe with the
#      app's own PCC_E2E self-test mode (ready log, preview reminder,
#      screenshot, self-exit). This step is continue-on-error on purpose
#      for the first runs: its log is uploaded either way, so a launch
#      failure is evidence, not a hidden pass.
#   5. Uploads dist/ and the launch log as artifacts.
#
# It does NOT run the Xvfb e2e suite: that suite skips cleanly without
# Xvfb, which Windows runners do not have. The PCC_E2E launch in step 4
# is the Windows equivalent.
#
# To run it: push this repo to GitHub (or open the Actions tab and run
# it manually via workflow_dispatch). No secrets, accounts, or network
# calls from the app itself are involved.

name: Windows test and build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build Windows NSIS installer
        run: npm run package:win

      - name: Install silently and launch installed app (PCC_E2E self-test)
        shell: pwsh
        run: |
          $env:PCC_E2E = '1'
          $env:PCC_E2E_WATER_MS = '8000'
          $env:PCC_E2E_EXERCISE_MS = '8500'
          $env:PCC_E2E_AUTOHIDE_MS = '4000'
          $env:PCC_E2E_EXIT_MS = '60000'
          $env:PCC_E2E_SCREENSHOT = "$env:GITHUB_WORKSPACE\installed-launch-shot.png"
          $env:ELECTRON_DISABLE_SANDBOX = '1'
          $installer = Get-ChildItem dist\*.exe | Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1 -ExpandProperty FullName
          $installProcess = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          Write-Output "Installer exited with code $($installProcess.ExitCode)"
          $programsFolders = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          Write-Output "Folders under $env:LOCALAPPDATA\Programs:"
          $programsFolders | ForEach-Object { Write-Output $_ }
          Write-Output "Uninstall registry entries for Personal Photo Companion:"
          foreach ($hive in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall')) {
            Get-ChildItem -Path $hive -ErrorAction SilentlyContinue | ForEach-Object {
              $displayName = (Get-ItemProperty -Path $_.PSPath -ErrorAction SilentlyContinue).DisplayName
              if ($displayName -like '*Personal Photo Companion*') { Write-Output "$hive : $displayName" }
            }
          }
          $searchRoots = @("$env:LOCALAPPDATA\Programs", $env:ProgramFiles, ${env:ProgramFiles(x86)})
          $exe = $null
          foreach ($root in $searchRoots) {
            $found = Get-ChildItem -Path $root -Recurse -Filter 'Personal Photo Companion.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            if ($found) { $exe = $found; break }
          }
          if (-not $exe) {
            Write-Output "Search roots: $($searchRoots -join ', ')"
            Write-Output "Folders under $env:LOCALAPPDATA\Programs:"
            $programsFolders | ForEach-Object { Write-Output $_ }
            Write-Output "Installer exited with code $($installProcess.ExitCode)"
            Write-Error "Installed exe not found"
            exit 1
          }
          Write-Output "Found installed exe: $exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--no-sandbox','--disable-gpu' -PassThru -NoNewWindow
          if (-not ($p.WaitForExit(90000))) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; exit 1 }
          Write-Output "Installed exe exited with code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Verify silent uninstall (runner only)
      shell: pwsh
              run: |
    $installedFolder = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*personal-photo-companion*' } | Select-Object -First 1
        if (-not $installedFolder) { Write-Error "Installed folder not found under $env:LOCALAPPDATA\Programs"; exit 1 }
          Write-Output "Found installed folder: $($installedFolder.FullName)"
          $uninstaller = Get-ChildItem -Path $installedFolder.FullName -Recurse -Filter '*Uninstall*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
      if (-not $uninstaller) { Write-Error "Uninstaller not found in $($installedFolder.FullName)"; exit 1 }
      Write-Output "Found uninstaller: $($uninstaller.FullName)"
      $uninstallProcess = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
      Write-Output "Uninstaller exited with code $($uninstallProcess.ExitCode)"
      if (Test-Path $installedFolder.FullName) { Write-Error "Silent uninstall failed: installed folder still exists: $($installedFolder.FullName)"; exit 1 }
      $remainingEntries = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall') | ForEach-Object { Get-ChildItem -Path $_ -ErrorAction SilentlyContinue | Where-Object { (Get-ItemProperty -Path $_.PSPath -ErrorAction SilentlyContinue).DisplayName -like '*Personal Photo Companion*' } }
      if ($remainingEntries) { Write-Error "Silent uninstall failed: uninstall registry entries remain"; exit 1 }
            Write-Output "Silent uninstall verified: installed folder and uninstall registry entries are gone."
    
- name: Python artifact checks
  run: python tests/check_build.py --dist dist
 - name: Bounded Windows launch attempt (PCC_E2E self-test)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PCC_E2E = '1'
          $env:PCC_E2E_WATER_MS = '8000'
          $env:PCC_E2E_EXERCISE_MS = '8500'
          $env:PCC_E2E_AUTOHIDE_MS = '4000'
          $env:PCC_E2E_EXIT_MS = '45000'
          $env:PCC_E2E_SCREENSHOT = "$env:GITHUB_WORKSPACE\windows-launch-shot.png"
          $env:ELECTRON_DISABLE_SANDBOX = '1'
          $exe = "$env:GITHUB_WORKSPACE\dist\win-unpacked\Personal Photo Companion.exe"
          if (-not (Test-Path $exe)) { Write-Error "Unpacked exe not found: $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList '--no-sandbox','--disable-gpu' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(90000)) {
            Write-Output "Launch attempt timed out after 90s; stopping process."
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Output "Unpacked exe exited with code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/
            windows-launch-shot.png
            installed-launch-shot.png
          if-no-files-found: warn
